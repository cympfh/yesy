<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>yesy · Local file search</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header class="masthead">
      <a class="wordmark" href="/" aria-label="yesy home">yesy</a>
    </header>

    <section class="search-section" aria-labelledby="search-heading">
      <h1 id="search-heading">Find something on this machine.</h1>
      <form id="search-form" role="search">
        <label for="query">Search file names and text</label>
        <div class="search-control">
          <input id="query" name="q" type="search" autocomplete="off" autofocus placeholder="A phrase, a file name, a half-remembered word…">
          <button type="submit">Search</button>
        </div>
      </form>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section id="search-history" class="search-history" aria-labelledby="history-heading" hidden>
      <h2 id="history-heading">Recent searches</h2>
      <div id="search-history-list" class="search-history-list"></div>
    </section>

    <section id="results" class="results" aria-label="Search results"></section>

    <template id="result-template">
      <article class="result">
        <h2></h2>
        <img class="image-preview" loading="lazy" decoding="async" hidden>
        <p class="snippet"></p>
        <dl class="paths">
          <div class="path-row linux-row">
            <dt>Linux</dt>
            <dd>
              <div class="path-value">
                <code></code>
                <button type="button" class="copy-path" aria-label="Copy Linux path" title="Copy Linux path">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 4V2h6v2M9 10h6M9 14h6"></path></svg>
                </button>
              </div>
              <span class="copy-feedback" aria-live="polite"></span>
            </dd>
          </div>
          <div class="path-row windows-row">
            <dt>Windows</dt>
            <dd>
              <div class="path-value">
                <a target="_blank" rel="noreferrer"><code></code></a>
                <button type="button" class="copy-path" aria-label="Copy Windows path" title="Copy Windows path">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 4V2h6v2M9 10h6M9 14h6"></path></svg>
                </button>
              </div>
              <span class="copy-feedback" aria-live="polite"></span>
            </dd>
          </div>
        </dl>
      </article>
    </template>
  </main>
  <noscript>Enable JavaScript to search this index.</noscript>
</body>
</html>
