<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>yesy · Local file search</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header class="masthead">
      <a class="wordmark" href="/" aria-label="yesy home">yesy</a>
    </header>

    <section class="search-section" aria-labelledby="search-heading">
      <h1 id="search-heading">Find something on this machine.</h1>
      <form id="search-form" role="search">
        <label for="query">Search file names and text</label>
        <div class="search-control">
          <input id="query" name="q" type="search" autocomplete="off" autofocus placeholder="A phrase, a file name, a half-remembered word…">
          <div class="search-actions">
            <button id="voice-search" class="voice-search" type="button" aria-label="Search by voice" title="Search by voice" aria-pressed="false" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="9" y="3" width="6" height="11" rx="3"></rect>
                <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"></path>
              </svg>
            </button>
            <button type="submit">Search</button>
          </div>
        </div>
      </form>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section id="search-history" class="search-history" aria-labelledby="history-heading" hidden>
      <h2 id="history-heading">Recent searches</h2>
      <div id="search-history-list" class="search-history-list"></div>
    </section>

    <section id="results" class="results" aria-label="Search results"></section>

    <template id="result-template">
      <article class="result">
        <h2></h2>
        <img class="image-preview" loading="lazy" decoding="async" hidden>
        <p class="snippet"></p>
        <dl class="file-metadata">
          <div><dt>Size</dt><dd class="file-size"></dd></div>
          <div><dt>Created</dt><dd class="file-created"></dd></div>
          <div><dt>Modified</dt><dd class="file-modified"></dd></div>
        </dl>
        <dl class="paths">
          <div class="path-row linux-row">
            <dt>Linux</dt>
            <dd>
              <div class="path-value">
                <code></code>
                <button type="button" class="copy-path" aria-label="Copy Linux path" title="Copy Linux path">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 4V2h6v2M9 10h6M9 14h6"></path></svg>
                </button>
              </div>
              <span class="copy-feedback" aria-live="polite"></span>
            </dd>
          </div>
          <div class="path-row windows-row">
            <dt>Windows</dt>
            <dd>
              <div class="path-value">
                <a target="_blank" rel="noreferrer"><code></code></a>
                <button type="button" class="copy-path" aria-label="Copy Windows path" title="Copy Windows path">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 4V2h6v2M9 10h6M9 14h6"></path></svg>
                </button>
              </div>
              <span class="copy-feedback" aria-live="polite"></span>
              <div class="open-with" hidden>
                <span class="open-with-label">Open with</span>
                <div class="open-with-actions">
                  <button type="button" class="open-application" data-application="neeview" aria-label="Open with NeeViewer" title="Open with NeeViewer">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M4 5.5h5.5A2.5 2.5 0 0 1 12 8v11a2.5 2.5 0 0 0-2.5-2.5H4zM20 5.5h-5.5A2.5 2.5 0 0 0 12 8v11a2.5 2.5 0 0 1 2.5-2.5H20z"></path>
                    </svg>
                  </button>
                  <button type="button" class="open-application" data-application="zed" aria-label="Open with Zed" title="Open with Zed">
                    <svg class="zed-icon" viewBox="0 0 96 96" aria-hidden="true">
                      <path fill-rule="evenodd" clip-rule="evenodd" d="M9 6C7.34315 6 6 7.34315 6 9V75H0V9C0 4.02944 4.02944 0 9 0H89.3787C93.3878 0 95.3955 4.84715 92.5607 7.68198L43.0551 57.1875H57V51H63V58.6875C63 61.1728 60.9853 63.1875 58.5 63.1875H37.0551L26.7426 73.5H73.5V36H79.5V73.5C79.5 76.8137 76.8137 79.5 73.5 79.5H20.7426L10.2426 90H87C88.6569 90 90 88.6569 90 87V21H96V87C96 91.9706 91.9706 96 87 96H6.62132C2.61224 96 0.604504 91.1529 3.43934 88.318L52.7574 39H39V45H33V37.5C33 35.0147 35.0147 33 37.5 33H58.7574L69.2574 22.5H22.5V60H16.5V22.5C16.5 19.1863 19.1863 16.5 22.5 16.5H75.2574L85.7574 6H9Z"></path>
                    </svg>
                  </button>
                  <span class="open-feedback" aria-live="polite"></span>
                </div>
              </div>
            </dd>
          </div>
        </dl>
      </article>
    </template>
  </main>
  <noscript>Enable JavaScript to search this index.</noscript>
</body>
</html>
