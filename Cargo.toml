[package]
name = "yesy"
version = "0.2.0"
edition = "2024"
description = "A local file search engine and web server"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
globset = "0.4"
ignore = "0.4"
percent-encoding = "2.3"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal"] }
toml = "0.9"
zip = { version = "9.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.20"
tower = { version = "0.5", features = ["util"] }
